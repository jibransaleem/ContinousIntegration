# Write a CI step that uploads a plot loss.png using cml-publish and appends the link to report.md

name : cml1

on : [push,pull_request]

jobs :
  test :
    runs-on : ubuntu-latest

    steps : 
      - name : Checkout
        uses : actions/checkout@v3

      - name : cml-publish
        env :
           repo_token : ${{secret.GITHUB_TOKEM}}
        runs : |
          cml-publish  loss.png --md >> report.md