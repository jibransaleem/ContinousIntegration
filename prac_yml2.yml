name : Yaml2

on : [push , pull_request]

jobs:
  tests:
    runs-on : ubuntu-latest

    steps:
      - name :  Check code
        uses : actions/checkout@v2

      - name : Setting up Python 
        uses : actions/setup-python@v5
        with :
          python-version:"3.11"
      - name : Install dependencies
        run : |
          "pip install pytest
           if [-f requirements.txt] ;then install requirements.txt fi;
          "
      - name : Run test 
        run : pytest
        